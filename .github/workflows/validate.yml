name: Validate Noctalia plugins

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifests, catalog, translations, docs, and thumbnail
        run: python3 tools/validate.py
      - name: Verify catalog is generated from manifests
        run: |
          cp catalog.toml /tmp/catalog.before.toml
          python3 tools/update_catalog.py
          diff -u /tmp/catalog.before.toml catalog.toml
